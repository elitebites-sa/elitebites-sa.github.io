<meta property="og:description" content="إيليت بايتس لخدمات الإعاشة: إعاشة يومية وبوفيهات وضيافة مناسبات في الرياض والدمام والخبر والجبيل.">

<style>
/* Layout: one dark editorial column, sections separated by hairlines; gold used only for the thesis word, markers and the primary action. */
:root{
  --bg:#050505; --bg2:#0f0f0f; --line:#262626; --fg:#fafafa; --muted:#a6a6a6; --gold:#e2a336;
  --gold-soft:rgba(226,163,54,.1); --gold-line:rgba(226,163,54,.3);
  --ar:'Tajawal',system-ui,'Segoe UI',Tahoma,sans-serif;
  --en:'Inter','Tajawal',system-ui,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ar);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased}
html[lang=en] body{font-family:var(--en)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media(min-width:720px){.wrap{padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:max(40px,env(safe-area-inset-right,0px))}}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(5,5,5,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:24px;height:68px}
.nav .logo img{height:22px;width:auto}
.nav ul{display:flex;gap:28px;list-style:none;margin:0 auto;padding:0;font-size:14px;color:var(--muted)}
.nav ul a:hover{color:var(--fg)}
.nav .acts{display:flex;gap:10px;align-items:center}
.btn{white-space:nowrap;display:inline-flex;align-items:center;gap:8px;font:500 14px/1 var(--ar);padding:13px 22px;border-radius:2px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer;transition:border-color .2s,background .2s,color .2s}
html[lang=en] .btn{font-family:var(--en)}
.btn:hover{border-color:var(--fg)}
.btn.solid{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.solid:hover{background:transparent;color:var(--fg)}
.btn.gold{background:var(--gold);color:#120d04;border-color:var(--gold);font-weight:700}
.btn.gold:hover{background:transparent;color:var(--gold)}
.lang{font:600 12px/1 var(--en);letter-spacing:.08em;color:var(--muted);border:1px solid var(--line);padding:10px 12px;border-radius:2px;background:none;cursor:pointer}
.lang:hover{color:var(--fg);border-color:var(--fg)}
@media(max-width:900px){.nav ul{display:none}.nav .acts{margin-inline-start:auto}}
@media(max-width:420px){#navCta{display:none}}

/* hero */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.hero canvas{position:absolute;inset:0;width:100%;height:100%}
.hero .wrap{position:relative;display:flex;flex-direction:column;justify-content:center;min-height:min(780px,88vh);padding-block:96px 72px}
.display{font-weight:800;font-size:clamp(56px,10vw,128px);line-height:1.02;margin:0;letter-spacing:-.01em;text-wrap:balance}
html[lang=en] .display{font-weight:700;letter-spacing:-.035em;font-size:clamp(48px,8.4vw,112px)}
.display .g{display:block;color:var(--gold)}
.hero p.lead{max-width:520px;font-size:clamp(17px,1.6vw,20px);color:var(--muted);margin:28px 0 36px}
.hero .ctas{display:flex;flex-wrap:wrap;gap:12px}
.hero .meta{position:absolute;inset-inline:0;bottom:24px}
.hero .meta .wrap{min-height:0;padding-block:0;flex-direction:row;justify-content:space-between;font-size:12px;color:var(--muted)}
.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.rise.d2{animation-delay:.12s}.rise.d3{animation-delay:.24s}.rise.d4{animation-delay:.36s}
@keyframes rise{from{transform:translateY(18px)}to{transform:none}}

/* sections */
section{border-bottom:1px solid var(--line)}
section.alt{background:var(--bg2)}
section>.wrap{padding-block:clamp(72px,10vw,128px)}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin-bottom:18px}
.eyebrow::before{content:"";width:7px;height:7px;background:var(--gold)}
h2{font-weight:700;font-size:clamp(32px,4.4vw,52px);line-height:1.18;margin:0 0 18px;text-wrap:balance;max-width:20ch}
html[lang=en] h2{letter-spacing:-.025em;line-height:1.08}
.sub{color:var(--muted);font-size:clamp(16px,1.4vw,19px);max-width:62ch;margin:0}
.statement{font-weight:700;font-size:clamp(28px,3.8vw,48px);line-height:1.35;margin:0;max-width:24ch;text-wrap:balance}
html[lang=en] .statement{letter-spacing:-.02em;line-height:1.15}
.statement em{font-style:normal;color:var(--gold)}

/* about */
.two{display:grid;grid-template-columns:1fr 1fr;gap:48px;margin-top:64px}
.two>div{min-width:0}
.two h3{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500;color:var(--muted);margin:0 0 10px}
.two h3::before{content:"";width:7px;height:7px;background:var(--gold)}
.two p{margin:0;font-size:clamp(17px,1.5vw,20px);line-height:1.75}
.stats{display:grid;grid-template-columns:repeat(4,1fr);margin-top:72px;border-top:1px solid var(--line)}
.stat{padding:32px 24px 8px;border-inline-start:1px solid var(--line);text-align:center}
.stat:first-child{border-inline-start:0}
.stat b{display:block;font:600 clamp(36px,4.4vw,56px)/1 var(--en);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.stat span{display:block;font-size:14px;color:var(--muted);margin-top:12px}
@media(max-width:760px){.two{grid-template-columns:1fr;gap:32px}.stats{grid-template-columns:1fr 1fr}.stat:nth-child(3){border-inline-start:0}.stat{border-top:1px solid var(--line)}}

/* values grid */
.cards{display:grid;grid-template-columns:repeat(3,1fr);margin-top:56px;border-top:1px solid var(--line);border-inline-start:1px solid var(--line)}
.card{position:relative;padding:40px 32px 36px;border-inline-end:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0;transition:background .25s}
.card:hover{background:rgba(250,250,250,.02)}
.card .n{position:absolute;inset-inline-end:24px;top:18px;font:700 64px/1 var(--en);color:#1c1c1c;letter-spacing:-.04em}
.card h3{font-size:21px;margin:56px 0 10px;font-weight:700}
.card p{margin:0;color:var(--muted);font-size:15px}
@media(max-width:900px){.cards{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.cards{grid-template-columns:1fr}}

/* services list */
.list{margin-top:56px;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:56px 1fr 220px auto;gap:28px;align-items:center;padding:28px 0;border-bottom:1px solid var(--line)}
.row .i{font:500 13px var(--en);color:var(--muted)}
.row h3{margin:0 0 6px;font-size:clamp(22px,2.4vw,30px);font-weight:700}
.row p{margin:0;color:var(--muted);font-size:15px;max-width:58ch}
.row .ph{aspect-ratio:16/10;max-width:100%;background:#111 center/cover;border-radius:2px;transition:filter .4s}
@media (hover:hover) and (pointer:fine){.row .ph{filter:grayscale(1) brightness(.8)}.row:hover .ph{filter:none}}
.tag{font-size:12px;color:var(--gold);border:1px solid var(--gold-line);background:var(--gold-soft);padding:6px 10px;border-radius:2px;white-space:nowrap}
.row>div{min-width:0}
@media(max-width:860px){.row{grid-template-columns:40px 1fr;gap:12px 16px}.row .ph{grid-column:2;width:100%}.row .tag{grid-column:2;justify-self:start}}

/* timeline */
.tl{display:grid;grid-template-columns:repeat(3,1fr);gap:40px;margin-top:64px;position:relative}
.tl::before{content:"";position:absolute;inset-inline:0;top:4px;height:1px;background:var(--line)}
.tl>div{position:relative;padding-top:36px;min-width:0}
.tl>div::before{content:"";position:absolute;inset-inline-start:0;top:0;width:9px;height:9px;background:var(--gold)}
.tl h3{font-size:clamp(26px,2.8vw,38px);margin:0 0 10px;font-weight:700}
.tl p{margin:0;color:var(--muted)}
.note{margin-top:48px;padding:20px 24px;border:1px solid var(--line);color:var(--muted);font-size:14px;max-width:820px}
@media(max-width:760px){.tl{grid-template-columns:1fr;gap:36px}.tl::before{inset-inline:auto;inset-inline-start:4px;top:0;bottom:0;width:1px;height:auto}.tl>div{padding-top:0;padding-inline-start:32px}}

/* menu */
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:48px}
.tabs button{font:500 14px/1 var(--ar);color:var(--muted);background:none;border:1px solid var(--line);padding:11px 16px;border-radius:2px;cursor:pointer}
html[lang=en] .tabs button{font-family:var(--en)}
.tabs button[aria-selected=true]{color:var(--bg);background:var(--fg);border-color:var(--fg)}
.menu{display:grid;grid-template-columns:repeat(3,1fr);margin-top:28px;border-top:1px solid var(--line)}
.dish{padding:26px 0;border-bottom:1px solid var(--line);padding-inline-end:28px;min-width:0}
.dish h4{margin:0 0 6px;font-size:18px;font-weight:700;display:flex;justify-content:space-between;gap:12px}
.dish h4 small{font:400 12px var(--en);color:var(--muted)}
html[lang=en] .dish h4 small{font-family:var(--ar)}
.dish p{margin:0;color:var(--muted);font-size:15px}
@media(max-width:900px){.menu{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.menu{grid-template-columns:1fr}.dish{padding-inline-end:0}}
.strip{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:56px}
.strip div{aspect-ratio:3/4;max-width:100%;background:#111 center/cover;border-radius:2px}
@media(max-width:760px){.strip{grid-template-columns:repeat(3,1fr)}}

/* quality */
.q{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:start;margin-top:56px}
.q>div{min-width:0}
.q .img{aspect-ratio:4/5;max-width:100%;background:#111 center/cover;border-radius:2px;position:sticky;top:96px}
.steps{border-top:1px solid var(--line)}
.step{display:grid;grid-template-columns:48px 1fr;gap:16px;padding:28px 0;border-bottom:1px solid var(--line)}
.step .i{font:600 14px var(--en);color:var(--gold);padding-top:6px}
.step h3{margin:0 0 6px;font-size:22px;font-weight:700}
.step p{margin:0;color:var(--muted)}
@media(max-width:860px){.q{grid-template-columns:1fr;gap:32px}.q .img{position:static;aspect-ratio:16/10}}

/* clients */
.clients{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:56px}
.client{border:1px solid var(--line);padding:56px 32px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;min-height:220px;transition:border-color .25s}
.client:hover{border-color:var(--gold-line)}
.client b{font-size:clamp(26px,3vw,36px);font-weight:800}
.client span{font:600 12px var(--en);letter-spacing:.18em;color:var(--muted)}
.client i{font-style:normal;font-size:12px;color:var(--gold)}
@media(max-width:640px){.clients{grid-template-columns:1fr}}

/* cta */
.cta{text-align:center}
.cta .wrap{display:flex;flex-direction:column;align-items:center}
.cta h2{max-width:none;font-size:clamp(40px,6vw,76px);font-weight:800}
.cta .sub{margin-bottom:32px}

/* contact */
.contact{display:grid;grid-template-columns:1fr 1fr;gap:48px;margin-top:8px;align-items:start}
.contact>div{min-width:0}
.info{display:grid;gap:12px;margin-top:36px}
.ic{display:flex;gap:16px;align-items:flex-start;padding:18px 20px;background:var(--bg2);border:1px solid var(--line);border-radius:2px}
.ic .b{flex:none;width:40px;height:40px;display:grid;place-items:center;background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:2px}
.ic svg{width:18px;height:18px;stroke:var(--gold);fill:none;stroke-width:1.6}
.ic small{display:block;color:var(--muted);font-size:13px}
.ic .v{font-size:16px;word-break:break-word}
.ic .v.ltr{direction:ltr;unicode-bidi:isolate;font-family:var(--en)}
form{background:var(--bg2);border:1px solid var(--line);padding:32px;border-radius:2px;display:grid;gap:18px}
form h3{margin:0;font-size:20px}
label{display:grid;gap:8px;font-size:14px}
input,select,textarea{font:inherit;font-size:15px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:2px;padding:12px 14px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}
textarea{min-height:120px;resize:vertical}
form .btn{justify-content:center;width:100%;padding:16px}
.sent{display:none;font-size:14px;color:var(--muted);border:1px solid var(--gold-line);background:var(--gold-soft);padding:14px 16px;border-radius:2px}
.sent.on{display:block}
.sent a{color:var(--gold);text-decoration:underline}
@media(max-width:860px){.contact{grid-template-columns:1fr}form{padding:22px}}

footer .wrap{padding-block:48px 32px;display:grid;gap:28px}
footer .top{display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}
footer .top img{height:22px;width:auto}
footer ul{display:flex;flex-wrap:wrap;gap:24px;list-style:none;margin:0;padding:0;color:var(--muted);font-size:14px}
footer .bottom{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;color:var(--muted);font-size:12px;border-top:1px solid var(--line);padding-top:24px}
@media(max-width:759px){.hero{display:flex;flex-direction:column}.hero .wrap{min-height:0;padding-block:72px 8px;order:1}.hero canvas{position:relative;order:2;height:300px;width:100%}.hero .meta .wrap{padding-block:0}.hero .meta{position:static;order:3;padding-block:8px 20px}}
</style>

</head>
<body>
<nav class="nav" aria-label="main">
  <div class="wrap">
    <a href="#home" class="logo" aria-label="Elite Bites"><img src="img/logo-white.png" alt="Elite Bites"></a>
    <ul id="navlinks"></ul>
    <div class="acts">
      <button class="lang" id="langBtn" type="button">EN</button>
      <a href="#contact" class="btn" id="navCta"></a>
    </div>
  </div>
</nav>

<header class="hero" id="home">
  <canvas id="map" aria-hidden="true"></canvas>
  <div class="wrap">
    <h1 class="display rise"><span id="h1a"></span><span class="g" id="h1b"></span></h1>
    <p class="lead rise d2" id="heroLead"></p>
    <div class="ctas rise d3"><a href="#contact" class="btn solid" id="cta1"></a><a href="#services" class="btn" id="cta2"></a></div>
  </div>
  <div class="meta"><div class="wrap"><span id="heroCities"></span><a href="#about" id="more"></a></div></div>
</header>

<main>
<section id="about"><div class="wrap">
  <div class="eyebrow" data-t="about.eyebrow"></div>
  <p class="statement" id="statement"></p>
  <div class="two">
    <div><h3 data-t="about.visionT"></h3><p data-t="about.vision"></p></div>
    <div><h3 data-t="about.missionT"></h3><p data-t="about.mission"></p></div>
  </div>
  <div class="stats" id="stats"></div>
</div></section>

<section class="alt" id="values"><div class="wrap">
  <div class="eyebrow" data-t="values.eyebrow"></div>
  <h2 data-t="values.title"></h2>
  <div class="cards" id="valueCards"></div>
</div></section>

<section id="services"><div class="wrap">
  <div class="eyebrow" data-t="services.eyebrow"></div>
  <h2 data-t="services.title"></h2>
  <p class="sub" data-t="services.sub"></p>
  <div class="list" id="svcList"></div>
</div></section>

<section class="alt" id="options"><div class="wrap">
  <div class="eyebrow" data-t="options.eyebrow"></div>
  <h2 data-t="options.title"></h2>
  <div class="tl" id="tl"></div>
  <p class="note" data-t="options.note"></p>
</div></section>

<section id="menu"><div class="wrap">
  <div class="eyebrow" data-t="menu.eyebrow"></div>
  <h2 data-t="menu.title"></h2>
  <p class="sub" data-t="menu.sub"></p>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="menu" id="menuGrid" role="tabpanel"></div>
  <div class="strip" id="strip"></div>
</div></section>

<section class="alt" id="quality"><div class="wrap">
  <div class="eyebrow" data-t="quality.eyebrow"></div>
  <h2 data-t="quality.title"></h2>
  <p class="sub" data-t="quality.sub"></p>
  <div class="q">
    <div class="img" style="background-image:url(img/w-kabsa.jpg)"></div>
    <div class="steps" id="qSteps"></div>
  </div>
</div></section>

<section id="clients"><div class="wrap">
  <div class="eyebrow" data-t="clients.eyebrow"></div>
  <h2 data-t="clients.title"></h2>
  <p class="sub" data-t="clients.sub"></p>
  <div class="clients" id="clientCards"></div>
</div></section>

<section class="alt" id="growth"><div class="wrap">
  <div class="eyebrow" data-t="growth.eyebrow"></div>
  <h2 data-t="growth.title"></h2>
  <p class="sub" data-t="growth.sub"></p>
  <div class="cards" id="growthCards" style="grid-template-columns:repeat(2,1fr)"></div>
</div></section>

<section class="cta"><div class="wrap">
  <h2 data-t="cta.title"></h2>
  <p class="sub" data-t="cta.sub"></p>
  <a href="#contact" class="btn solid" data-t="cta.btn"></a>
</div></section>

<section id="contact"><div class="wrap">
  <div class="contact">
    <div>
      <div class="eyebrow" data-t="contact.eyebrow"></div>
      <h2 data-t="contact.title"></h2>
      <div class="info" id="info"></div>
    </div>
    <form id="form" novalidate>
      <h3 data-t="form.title"></h3>
      <label for="f-name"><span data-t="form.name"></span><input id="f-name" name="name" required autocomplete="name"></label>
      <label for="f-phone"><span data-t="form.phone"></span><input id="f-phone" name="phone" type="tel" dir="ltr" required autocomplete="tel"></label>
      <label for="f-type"><span data-t="form.type"></span><select id="f-type" name="type"></select></label>
      <label for="f-count"><span data-t="form.count"></span><input id="f-count" name="count" inputmode="numeric"></label>
      <label for="f-msg"><span data-t="form.msg"></span><textarea id="f-msg" name="msg"></textarea></label>
      <button class="btn gold" type="submit" data-t="form.send"></button>
      <p class="sent" id="sent" role="status"></p>
    </form>
  </div>
</div></section>
</main>

<footer><div class="wrap">
  <div class="top"><img src="img/logo-white.png" alt="Elite Bites"><ul id="footLinks"></ul></div>
  <div class="bottom"><span id="copy"></span><span id="reg" dir="ltr"></span></div>
  <p dir="ltr" style="margin:0;font-size:11px;color:var(--muted);text-align:center">Photos: Pexels; Wikimedia Commons — Vengolis, Slywire, Abdulla Al Muhairi, Shreya13jain, pelican from Tokyo, Kalesh (CC BY / CC BY-SA)</p>

  const ar=L==='ar';
  $('menuGrid').setAttribute('aria-labelledby','tab-'+tab);
  $('menuGrid').innerHTML=MENU[tab].map(d=>`<div class="dish"><h4><span>${ar?d[0]:d[1]}</span><small>${ar?d[1]:d[0]}</small></h4><p>${ar?d[2]:d[3]}</p></div>`).join('');
}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;tab=+b.dataset.i;document.querySelectorAll('#tabs button').forEach(x=>x.setAttribute('aria-selected',x===b));renderMenu()});
$('langBtn').addEventListener('click',()=>{L=L==='ar'?'en':'ar';try{localStorage.setItem('eb-lang',L)}catch(e){}render()});

$('form').addEventListener('submit',e=>{
  e.preventDefault();const t=T[L].form,out=$('sent');
  const name=$('f-name').value.trim(),phone=$('f-phone').value.trim(),count=$('f-count').value.trim(),msg=$('f-msg').value.trim(),type=$('f-type').value;
  if(!name||!phone){out.textContent=t.need;out.classList.add('on');(name?$('f-phone'):$('f-name')).focus();return}
  const lines=[t.wa,`${t.name}: ${name}`,`${t.phone}: ${phone}`,`${t.type}: ${type}`];
  if(count)lines.push(`${t.count}: ${count}`);
  if(msg)lines.push(msg);
  const u='https://wa.me/'+PHONE+'?text='+encodeURIComponent(lines.join('\n'));
  out.innerHTML=t.ready.replace('{u}',esc(u));out.classList.add('on');
});

/* dot-matrix map of Saudi Arabia with the four service cities */
const KSA=[[34.6,28.1],[35,29.4],[36.1,29.2],[37,30],[37.7,30.4],[37.9,31.5],[39.2,32.2],[40.4,31.9],[42.1,31.1],[44.7,29.2],[46.5,29.1],[47.5,29],[48.4,28.5],[48.8,27.7],[49.6,26.9],[50.1,26.4],[50.2,25.7],[50.8,24.8],[51.6,24.2],[52,23],[55.2,22.7],[55.7,22],[55,20],[52,19],[49.1,18.6],[48.2,17.4],[47.5,17.1],[46.4,17.2],[45.4,17.3],[44.1,17.4],[43.3,17.6],[43,16.7],[42.8,16.4],[42.6,16.8],[42.3,17.5],[41.2,19.1],[40.2,20.2],[39.1,21.6],[39,22.6],[38.5,23.6],[37.5,24.3],[37.2,25],[36.6,25.9],[36.2,26.6],[35.6,27.4]];
const CITIES=[[46.7,24.7],[50.1,26.45],[50.2,26.2],[49.65,27.0]];
function inside(x,y){let c=false;for(let i=0,j=KSA.length-1;i<KSA.length;j=i++){const[xi,yi]=KSA[i],[xj,yj]=KSA[j];if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)c=!c}return c}
function drawMap(){
  const cv=$('map'),hero=cv.parentElement,dpr=Math.min(2,window.devicePixelRatio||1);
  const W=cv.clientWidth,H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;
  const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);
  const rtl=L==='ar',narrow=W<760;
  const lon0=33,lon1=57,lat0=15,lat1=33.5;
  const mapW=narrow?Math.min(W*.92,(H*.9)*(lon1-lon0)/(lat1-lat0)/1.12):Math.min(W*(W<1200?.42:.58),760),mapH=mapW*(lat1-lat0)/(lon1-lon0)*1.12;
  const ox=narrow?(W-mapW)/2-(rtl?-20:20):(rtl?W*.04:W-mapW-W*.04),oy=(H-mapH)/2;
  const px=x=>ox+(x-lon0)/(lon1-lon0)*mapW,py=y=>oy+(lat1-y)/(lat1-lat0)*mapH;
  const step=narrow?.38:.32,r=Math.max(1.1,mapW/(lon1-lon0)*step*.26);
  for(let y=lat1;y>=lat0;y-=step)for(let x=lon0;x<=lon1;x+=step){
    const ins=inside(x,y);g.fillStyle=ins?'rgba(250,250,250,.34)':'rgba(250,250,250,.055)';
    g.beginPath();g.arc(px(x),py(y),ins?r:r*.8,0,6.283);g.fill();
  }
  const names=T[L].mapCities;g.font=`500 ${narrow?11:13}px ${rtl?'Tajawal':'Inter'},sans-serif`;g.textBaseline='middle';
  CITIES.forEach(([x,y],i)=>{
    const X=px(x),Y=py(y);
    g.fillStyle='rgba(226,163,54,.18)';g.beginPath();g.arc(X,Y,r*5.5,0,6.283);g.fill();
    g.fillStyle='#e2a336';g.beginPath();g.arc(X,Y,r*2,0,6.283);g.fill();
    if(i===0){g.textAlign='right';g.fillText(names[i],X-r*7,Y)}
    else{g.textAlign='left';g.fillText(names[i],X+r*6+18,Y+[0,-2,22,-26][i]);g.strokeStyle='rgba(226,163,54,.35)';g.beginPath();g.moveTo(X+r*2.2,Y);g.lineTo(X+r*6+14,Y+[0,-2,22,-26][i]);g.stroke()}
  });
}
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(drawMap,120)});
render();
document.fonts&&document.fonts.ready.then(drawMap);
